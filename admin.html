<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة EA Luxury</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f2eb;margin:0;color:#222}
header{background:#111;color:#d6b36a;padding:22px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:650px;margin:25px auto;padding:15px}
section{background:white;padding:20px;margin-bottom:20px;border-radius:12px}
h2{color:#9b793e}
input,select,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:7px;font-size:16px}
button{background:#171717;color:#d6b36a;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.order{border-bottom:1px solid #ddd;padding:12px 0}
.stock{font-weight:bold;color:#287a36}
.out{font-weight:bold;color:#c62828}
small{display:block;color:#666}
.image-preview{width:100%;max-height:220px;object-fit:contain;background:#f5f2eb;border-radius:8px;margin:8px 0;display:none}
.file-button{display:block;background:#171717;color:#d6b36a;padding:13px;text-align:center;border-radius:7px;margin:8px 0;font-weight:bold;cursor:pointer}
.file-input{display:none}
</style>
</head>
<body>
<header>EA Luxury - لوحة الإدارة</header>
<main>
<section id="login">
<h2>تسجيل دخول الإدارة</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button type="button" onclick="login()">دخول</button>
<p id="loginMsg"></p>
</section>
<div id="dashboard" hidden>
<section>
<h2>إضافة منتج جديد</h2>
<input id="name" placeholder="اسم المنتج">
<select id="category">
<option value="حريمي">ملابس حريمي</option>
<option value="رجالي">ملابس رجالي</option>
</select>
<input id="price" type="number" min="1" placeholder="السعر بالجنيه">
<input id="stock" type="number" min="0" step="1" placeholder="الكمية المتاحة">
<input id="sizes" placeholder="المقاسات مثال: M, L, XL">
<input id="colors" placeholder="الألوان">
<label>صور المنتج:</label>
<input id="photo" type="file" accept="image/*" multiple>
<small>يمكنك اختيار حتى 5 صور للمنتج الواحد.</small>
<button type="button" onclick="addProduct()">حفظ المنتج</button>
<p id="productMsg"></p>
</section>
<section>
<h2>المنتجات والمخزون</h2>
<div id="productsList">جاري التحميل...</div>
</section>
<section id="settingsSection">
<h2>⚙️ إعدادات المتجر</h2>
<label>اسم المتجر</label>
<input id="storeName" placeholder="EA Luxury">
<label>وصف المتجر</label>
<input id="storeDescription" placeholder="أزياء حريمي ورجالي">
<label>رقم الهاتف</label>
<input id="storePhone" placeholder="رقم الهاتف">
<label>رقم واتساب</label>
<input id="storeWhatsapp" placeholder="رقم واتساب">
<label>رابط فيسبوك</label>
<input id="storeFacebook" placeholder="رابط الصفحة">
<label>رابط تيك توك</label>
<input id="storeTiktok" placeholder="رابط الحساب">
<hr>
<h3>صورة شعار المتجر</h3>
<label class="file-button" for="storeLogoFile">📷 اختيار صورة الشعار</label>
<input class="file-input" id="storeLogoFile" type="file" accept="image/*">
<img id="logoPreview" class="image-preview" alt="معاينة الشعار">
<small id="logoStatus">لم يتم اختيار صورة جديدة.</small>
<hr>
<h3>صورة غلاف المتجر</h3>
<label class="file-button" for="storeCoverFile">📷 اختيار صورة الغلاف</label>
<input class="file-input" id="storeCoverFile" type="file" accept="image/*">
<img id="coverPreview" class="image-preview" alt="معاينة الغلاف">
<small id="coverStatus">لم يتم اختيار صورة جديدة.</small>
<hr>
<label>مصاريف الشحن بالجنيه</label>
<input id="shippingFee" type="number" min="0" value="0">
<label>الحد الأدنى للشحن المجاني</label>
<input id="freeShipping" type="number" min="0" value="0">
<label>اللون الأساسي</label>
<input id="storeColor" type="color" value="#171717">
<label>من نحن</label>
<input id="aboutStore" placeholder="نبذة عن المتجر">
<label>سياسة الاستبدال والاسترجاع</label>
<input id="returnPolicy" placeholder="سياسة الاستبدال">
<button type="button" id="saveSettingsButton" onclick="saveSettings()">حفظ إعدادات المتجر</button>
<p id="settingsMsg"></p>
</section>
<section>
<h2>طلبات العملاء</h2>
<button type="button" onclick="loadOrders()">تحديث الطلبات</button>
<div id="ordersList">اضغط تحديث الطلبات.</div>
</section>
</div>
</main>
<script>
(function(){
const SUPABASE_URL="https://jezqohivdiziuzfmllvq.supabase.co";
const SUPABASE_KEY="sb_publishable_hrP0-e5_ou1HHeKZpCu8jw_ORY_-zdh";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let adminReady=false;
let logoUrl="";
let coverUrl="";
function previewImage(inputId,previewId,statusId){
const input=document.getElementById(inputId);
const preview=document.getElementById(previewId);
const status=document.getElementById(statusId);
input.addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
if(!file.type.startsWith("image/")){
alert("من فضلك اختر ملف صورة صحيح.");
this.value="";
return;
}
preview.src=URL.createObjectURL(file);
preview.style.display="block";
status.textContent="تم اختيار: "+file.name;
});
}
previewImage("storeLogoFile","logoPreview","logoStatus");
previewImage("storeCoverFile","coverPreview","coverStatus");
async function login(){
const msg=document.getElementById("loginMsg");
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
if(!email||!password){
msg.textContent="اكتب البريد الإلكتروني وكلمة المرور.";
return;
}
msg.textContent="جاري الاتصال...";
try{
const {data,error}=await client.auth.signInWithPassword({
email:email,
password:password
});
if(error)throw error;
msg.textContent="جاري فحص الصلاحيات...";
await checkAdmin(data.user.id);
}catch(error){
console.error(error);
msg.textContent="فشل تسجيل الدخول: "+error.message;
}
}
async function checkAdmin(userId){
try{
const {data,error}=await client
.from("store_admins")
.select("user_id")
.eq("user_id",userId)
.maybeSingle();
if(error||!data){
document.getElementById("loginMsg").textContent=
error?"خطأ في الصلاحيات: "+error.message:
"الحساب ليس لديه صلاحية الإدارة.";
await client.auth.signOut();
return;
}
adminReady=true;
document.getElementById("login").hidden=true;
document.getElementById("dashboard").hidden=false;
await loadProducts();
await loadOrders();
await loadSettings();
}catch(error){
console.error(error);
document.getElementById("loginMsg").textContent=
"حدث خطأ أثناء فحص الصلاحيات: "+error.message;
}
}
async function addProduct(){
if(!adminReady)return;
const msg=document.getElementById("productMsg");
const name=document.getElementById("name").value.trim();
const category=document.getElementById("category").value;
const price=Number(document.getElementById("price").value);
const stockValue=document.getElementById("stock").value;
const stock=Number(stockValue);
const sizes=document.getElementById("sizes").value.split(",").map(x=>x.trim()).filter(Boolean);
const colors=document.getElementById("colors").value.split(",").map(x=>x.trim()).filter(Boolean);
const files=Array.from(document.getElementById("photo").files);
if(!name||!Number.isFinite(price)||price<=0||stockValue===""||!Number.isInteger(stock)||stock<0||files.length===0){
msg.textContent="اكتب الاسم والسعر والكمية واختر صورة واحدة على الأقل.";
return;
}
if(files.length>5){
msg.textContent="يمكن اختيار 5 صور فقط للمنتج.";
return;
}
if(files.some(file=>!file.type.startsWith("image/"))){
msg.textContent="اختر ملفات صور فقط.";
return;
}
const uploadedPaths=[];
try{
msg.textContent="جاري رفع الصور...";
const imageUrls=[];
for(let i=0;i<files.length;i++){
const file=files[i];
const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+i+"-"+safeName;
const {error:uploadError}=await client.storage.from("product-images").upload(path,file);
if(uploadError)throw uploadError;
uploadedPaths.push(path);
const {data:imageData}=client.storage.from("product-images").getPublicUrl(path);
imageUrls.push(imageData.publicUrl);
}
msg.textContent="جاري حفظ بيانات المنتج...";
const {error}=await client.from("products").insert({
name:name,
category:category,
price:price,
stock:stock,
sizes:sizes,
colors:colors,
image_url:imageUrls[0],
image_urls:imageUrls,
active:true
});
if(error)throw error;
msg.textContent="تم إضافة المنتج بنجاح وحفظ "+imageUrls.length+" صور.";
["name","price","stock","sizes","colors","photo"].forEach(id=>{
document.getElementById(id).value="";
});
await loadProducts();
}catch(error){
console.error(error);
if(uploadedPaths.length){
await client.storage.from("product-images").remove(uploadedPaths);
}
msg.textContent="تعذر إضافة المنتج: "+error.message;
}
}
async function loadProducts(){
if(!adminReady)return;
const box=document.getElementById("productsList");
box.textContent="جاري تحميل المنتجات...";
const {data,error}=await client.from("products").select("*").order("created_at",{ascending:false});
if(error){
box.textContent="خطأ في تحميل المنتجات: "+error.message;
return;
}
box.innerHTML="";
if(!data||data.length===0){
box.textContent="لا توجد منتجات.";
return;
}
data.forEach(p=>{
const div=document.createElement("div");
div.className="order";
const title=document.createElement("b");
title.textContent=p.name+" - "+p.price+" جنيه";
const detail=document.createElement("p");
detail.textContent=p.category+" | "+(p.active?"نشط":"مخفي");
const quantityLabel=document.createElement("p");
quantityLabel.className=Number(p.stock)>0?"stock":"out";
quantityLabel.textContent=Number(p.stock)>0?"الكمية المتاحة: "+p.stock:"نفد المخزون";
const imageCount=document.createElement("p");
const images=Array.isArray(p.image_urls)?p.image_urls:[];
imageCount.textContent="عدد الصور: "+(images.length||(p.image_url?1:0));
const stockInput=document.createElement("input");
stockInput.type="number";
stockInput.min="0";
stockInput.step="1";
stockInput.value=p.stock;
stockInput.placeholder="الكمية الجديدة";
const saveButton=document.createElement("button");
saveButton.type="button";
saveButton.textContent="حفظ الكمية";
saveButton.onclick=()=>updateStock(p.id,stockInput.value);
const activeButton=document.createElement("button");
activeButton.type="button";
activeButton.textContent=p.active?"إخفاء المنتج":"إظهار المنتج";
activeButton.onclick=()=>toggleProduct(p.id,!p.active);
div.append(title,detail,quantityLabel,imageCount,stockInput,saveButton,activeButton);
box.append(div);
});
}
async function updateStock(id,value){
if(!adminReady)return;
const stock=Number(value);
if(value===""||!Number.isInteger(stock)||stock<0){
alert("اكتب كمية صحيحة، صفر أو أكثر.");
return;
}
const {error}=await client.from("products").update({stock:stock}).eq("id",id);
if(error){
alert("تعذر تحديث الكمية: "+error.message);
return;
}
alert("تم تحديث كمية المنتج.");
await loadProducts();
}
async function toggleProduct(id,active){
if(!adminReady)return;
const {error}=await client.from("products").update({active:active}).eq("id",id);
if(error){
alert("تعذر تحديث المنتج: "+error.message);
return;
}
await loadProducts();
}
async function loadOrders(){
if(!adminReady)return;
const box=document.getElementById("ordersList");
box.textContent="جاري تحميل الطلبات...";
const {data,error}=await client.from("orders").select("*, order_items(*)").order("created_at",{ascending:false});
if(error){
box.textContent="تعذر تحميل الطلبات: "+error.message;
return;
}
box.innerHTML="";
if(!data||data.length===0){
box.textContent="لا توجد طلبات حتى الآن.";
return;
}
data.forEach(o=>{
const div=document.createElement("div");
div.className="order";
const title=document.createElement("b");
title.textContent="طلب من: "+o.customer_name;
const details=document.createElement("p");
details.textContent="الهاتف: "+o.phone+" | المحافظة: "+o.governorate;
const address=document.createElement("p");
address.textContent="العنوان: "+o.address;
const total=document.createElement("p");
total.textContent="الإجمالي: "+o.total+" جنيه";
const items=document.createElement("div");
items.textContent="المنتجات: "+(o.order_items||[]).map(item=>item.product_name+" × "+item.quantity).join("، ");
const status=document.createElement("p");
status.textContent="الحالة الحالية: "+o.status;
const select=document.createElement("select");
["جديد","قيد التجهيز","تم الشحن","مكتمل","ملغي"].forEach(s=>{
const option=document.createElement("option");
option.value=s;
option.textContent=s;
if(s===o.status)option.selected=true;
select.append(option);
});
select.onchange=()=>updateOrder(o.id,select.value);
div.append(title,details,address,total,items,status,select);
box.append(div);
});
}
async function updateOrder(id,status){
if(!adminReady)return;
const {error}=await client.from("orders").update({status:status}).eq("id",id);
if(error){
alert("تعذر تحديث الطلب: "+error.message);
return;
}
alert("تم تحديث حالة الطلب.");
await loadOrders();
}
async function uploadImage(file,folder){
if(!file)return null;
if(!file.type.startsWith("image/")){
throw new Error("الملف المختار ليس صورة.");
}
const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
const path=folder+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+safeName;
const {error}=await client.storage.from("product-images").upload(path,file);
if(error)throw error;
const {data}=client.storage.from("product-images").getPublicUrl(path);
return data.publicUrl;
}
async function loadSettings(){
const msg=document.getElementById("settingsMsg");
const {data,error}=await client.from("store_settings").select("settings").eq("id",1).maybeSingle();
if(error){
msg.textContent="تعذر تحميل الإعدادات: "+error.message;
return;
}
const s=data?.settings||{};
logoUrl=s.storeLogo||"";
coverUrl=s.storeCover||"";
const fields={
storeName:s.storeName,
storeDescription:s.storeDescription,
storePhone:s.storePhone,
storeWhatsapp:s.storeWhatsapp,
storeFacebook:s.storeFacebook,
storeTiktok:s.storeTiktok,
shippingFee:s.shippingFee,
freeShipping:s.freeShipping,
storeColor:s.storeColor,
aboutStore:s.aboutStore,
returnPolicy:s.returnPolicy
};
Object.entries(fields).forEach(([id,value])=>{
if(value!==undefined&&value!==null){
document.getElementById(id).value=value;
}
});
if(logoUrl){
document.getElementById("logoPreview").src=logoUrl;
document.getElementById("logoPreview").style.display="block";
document.getElementById("logoStatus").textContent="الشعار الحالي محفوظ.";
}
if(coverUrl){
document.getElementById("coverPreview").src=coverUrl;
document.getElementById("coverPreview").style.display="block";
document.getElementById("coverStatus").textContent="الغلاف الحالي محفوظ.";
}
}
async function saveSettings(){
if(!adminReady)return;
const msg=document.getElementById("settingsMsg");
const button=document.getElementById("saveSettingsButton");
const logoFile=document.getElementById("storeLogoFile").files[0];
const coverFile=document.getElementById("storeCoverFile").files[0];
msg.textContent="جاري حفظ الإعدادات ورفع الصور...";
button.disabled=true;
try{
if(logoFile){
msg.textContent="جاري رفع شعار المتجر...";
const uploadedLogo=await uploadImage(logoFile,"store");
if(uploadedLogo)logoUrl=uploadedLogo;
}
if(coverFile){
msg.textContent="جاري رفع صورة الغلاف...";
const uploadedCover=await uploadImage(coverFile,"store");
if(uploadedCover)coverUrl=uploadedCover;
}
const settings={
storeName:document.getElementById("storeName").value,
storeDescription:document.getElementById("storeDescription").value,
storePhone:document.getElementById("storePhone").value,
storeWhatsapp:document.getElementById("storeWhatsapp").value,
storeFacebook:document.getElementById("storeFacebook").value,
storeTiktok:document.getElementById("storeTiktok").value,
storeLogo:logoUrl,
storeCover:coverUrl,
shippingFee:Number(document.getElementById("shippingFee").value),
freeShipping:Number(document.getElementById("freeShipping").value),
storeColor:document.getElementById("storeColor").value,
aboutStore:document.getElementById("aboutStore").value,
returnPolicy:document.getElementById("returnPolicy").value
};
msg.textContent="جاري حفظ البيانات...";
const {error}=await client.from("store_settings").upsert({
id:1,
settings:settings,
updated_at:new Date().toISOString()
});
if(error)throw error;
document.getElementById("storeLogoFile").value="";
document.getElementById("storeCoverFile").value="";
document.getElementById("logoStatus").textContent=logoUrl?"تم حفظ الشعار بنجاح.":"لم يتم اختيار شعار.";
document.getElementById("coverStatus").textContent=coverUrl?"تم حفظ الغلاف بنجاح.":"لم يتم اختيار غلاف.";
msg.textContent="تم حفظ إعدادات المتجر والصور بنجاح.";
}catch(error){
console.error(error);
msg.textContent="تعذر الحفظ: "+error.message;
}finally{
button.disabled=false;
}
}
window.login=login;
window.addProduct=addProduct;
window.loadOrders=loadOrders;
window.saveSettings=saveSettings;
})();
</script>
</body>
</html>
