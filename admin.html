
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة EA Luxury</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f5f2eb;margin:0;color:#222}
header{background:#111;color:#d6b36a;padding:22px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:650px;margin:25px auto;padding:15px}
section{background:white;padding:20px;margin-bottom:20px;border-radius:12px}
h2{color:#9b793e}
input,select,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:7px;font-size:16px}
button{background:#171717;color:#d6b36a;border:0;font-weight:bold}
.order{border-bottom:1px solid #ddd;padding:12px 0}
.stock{font-weight:bold;color:#287a36}
.out{font-weight:bold;color:#c62828}
</style>
</head>

<body>
<header>EA Luxury - لوحة الإدارة</header>
<main>

<section id="login">
<h2>تسجيل دخول الإدارة</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<p id="loginMsg"></p>
</section>

<div id="dashboard" hidden>

<section>
<h2>إضافة منتج جديد</h2>

<input id="name" placeholder="اسم المنتج">

<select id="category">
<option value="حريمي">ملابس حريمي</option>
<option value="رجالي">ملابس رجالي</option>
</select>

<input id="price" type="number" min="1" placeholder="السعر بالجنيه">
<input id="stock" type="number" min="0" step="1" placeholder="الكمية المتاحة">
<input id="sizes" placeholder="المقاسات مثال: M, L, XL">
<input id="colors" placeholder="الألوان">

<label>صورة المنتج:</label>
<input id="photo" type="file" accept="image/*">

<button onclick="addProduct()">حفظ المنتج</button>
<p id="productMsg"></p>
</section>

<section>
<h2>المنتجات والمخزون</h2>
<div id="productsList">جاري التحميل...</div>
</section>

<section>
<h2>طلبات العملاء</h2>
<button onclick="loadOrders()">تحديث الطلبات</button>
<div id="ordersList">اضغط تحديث الطلبات.</div>
</section>

</div>
</main>

<script>
(function () {

const SUPABASE_URL = "https://jezqohivdiziuzfmllvq.supabase.co";
const SUPABASE_KEY = "sb_publishable_hrP0-e5_ou1HHeKZpCu8jw_ORY_-zdh";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let adminReady = false;

async function login() {
  const msg = document.getElementById("loginMsg");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    msg.textContent = "اكتب البريد الإلكتروني وكلمة المرور.";
    return;
  }

  msg.textContent = "جاري الاتصال...";

  try {
    const result = await client.auth.signInWithPassword({email, password});
    if (result.error) throw result.error;

    msg.textContent = "جاري فحص الصلاحيات...";
    await checkAdmin(result.data.user.id);

  } catch (error) {
    console.error(error);
    msg.textContent = "فشل تسجيل الدخول: " + error.message;
  }
}

async function checkAdmin(userId) {
  const {data, error} = await client
    .from("store_admins")
    .select("user_id")
    .eq("user_id", userId)
    .maybeSingle();

  if (error || !data) {
    document.getElementById("loginMsg").textContent =
      error ? "خطأ في الصلاحيات: " + error.message :
      "الحساب ليس لديه صلاحية الإدارة.";

    await client.auth.signOut();
    return;
  }

  adminReady = true;
  document.getElementById("login").hidden = true;
  document.getElementById("dashboard").hidden = false;

  loadProducts();
  loadOrders();
}

async function addProduct() {
  if (!adminReady) return;

  const msg = document.getElementById("productMsg");
  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value;
  const price = Number(document.getElementById("price").value);
  const stockValue = document.getElementById("stock").value;
  const stock = Number(stockValue);

  const sizes = document.getElementById("sizes").value
    .split(",").map(x => x.trim()).filter(Boolean);

  const colors = document.getElementById("colors").value
    .split(",").map(x => x.trim()).filter(Boolean);

  const file = document.getElementById("photo").files[0];

  if (!name || !Number.isFinite(price) || price <= 0 ||
      stockValue === "" || !Number.isInteger(stock) || stock < 0 || !file) {
    msg.textContent = "اكتب الاسم والسعر والكمية الصحيحة واختر صورة.";
    return;
  }

  try {
    msg.textContent = "جاري رفع الصورة...";

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = Date.now() + "-" +
      Math.random().toString(36).slice(2) + "-" + safeName;

    const {error: uploadError} = await client.storage
      .from("product-images")
      .upload(path, file);

    if (uploadError) throw uploadError;

    const {data: imageData} = client.storage
      .from("product-images")
      .getPublicUrl(path);

    const {error} = await client.from("products").insert({
      name,
      category,
      price,
      stock,
      sizes,
      colors,
      image_url: imageData.publicUrl,
      active: true
    });

    if (error) throw error;

    msg.textContent = "تم إضافة المنتج والكمية بنجاح.";

    ["name", "price", "stock", "sizes", "colors", "photo"]
      .forEach(id => document.getElementById(id).value = "");

    loadProducts();

  } catch (error) {
    console.error(error);
    msg.textContent = "تعذر إضافة المنتج: " + error.message;
  }
}

async function loadProducts() {
  if (!adminReady) return;

  const box = document.getElementById("productsList");
  box.textContent = "جاري تحميل المنتجات...";

  const {data, error} = await client
    .from("products")
    .select("*")
    .order("created_at", {ascending: false});

  if (error) {
    box.textContent = "خطأ في تحميل المنتجات: " + error.message;
    return;
  }

  box.innerHTML = "";

  if (!data.length) {
    box.textContent = "لا توجد منتجات.";
    return;
  }

  data.forEach(p => {
    const div = document.createElement("div");
    div.className = "order";

    const title = document.createElement("b");
    title.textContent = p.name + " - " + p.price + " جنيه";

    const detail = document.createElement("p");
    detail.textContent = p.category + " | " +
      (p.active ? "نشط" : "مخفي");

    const quantityLabel = document.createElement("p");
    quantityLabel.className = p.stock > 0 ? "stock" : "out";
    quantityLabel.textContent = p.stock > 0
      ? "الكمية المتاحة: " + p.stock
      : "نفد المخزون";

    const stockInput = document.createElement("input");
    stockInput.type = "number";
    stockInput.min = "0";
    stockInput.step = "1";
    stockInput.value = p.stock;
    stockInput.placeholder = "الكمية الجديدة";

    const saveButton = document.createElement("button");
    saveButton.textContent = "حفظ الكمية";
    saveButton.onclick = () =>
      updateStock(p.id, stockInput.value);

    const activeButton = document.createElement("button");
    activeButton.textContent = p.active ? "إخفاء المنتج" : "إظهار المنتج";
    activeButton.onclick = () => toggleProduct(p.id, !p.active);

    div.append(
      title,
      detail,
      quantityLabel,
      stockInput,
      saveButton,
      activeButton
    );

    box.append(div);
  });
}

async function updateStock(id, value) {
  if (!adminReady) return;

  const stock = Number(value);

  if (value === "" || !Number.isInteger(stock) || stock < 0) {
    alert("اكتب كمية صحيحة، صفر أو أكثر.");
    return;
  }

  const {error} = await client
    .from("products")
    .update({stock})
    .eq("id", id);

  if (error) {
    alert("تعذر تحديث الكمية: " + error.message);
    return;
  }

  alert("تم تحديث كمية المنتج.");
  loadProducts();
}

async function toggleProduct(id, active) {
  if (!adminReady) return;

  const {error} = await client
    .from("products")
    .update({active})
    .eq("id", id);

  if (error) {
    alert("تعذر تحديث المنتج: " + error.message);
    return;
  }

  loadProducts();
}

async function loadOrders() {
  if (!adminReady) return;

  const box = document.getElementById("ordersList");
  box.textContent = "جاري تحميل الطلبات...";

  const {data, error} = await client
    .from("orders")
    .select("*, order_items(*)")
    .order("created_at", {ascending: false});

  if (error) {
    box.textContent = "تعذر تحميل الطلبات: " + error.message;
    return;
  }

  box.innerHTML = "";

  if (!data.length) {
    box.textContent = "لا توجد طلبات حتى الآن.";
    return;
  }

  data.forEach(o => {
    const div = document.createElement("div");
    div.className = "order";

    const title = document.createElement("b");
    title.textContent = "طلب من: " + o.customer_name;

    const details = document.createElement("p");
    details.textContent = "الهاتف: " + o.phone +
      " | المحافظة: " + o.governorate;

    const address = document.createElement("p");
    address.textContent = "العنوان: " + o.address;

    const total = document.createElement("p");
    total.textContent = "الإجمالي: " + o.total + " جنيه";

    const status = document.createElement("p");
    status.textContent = "الحالة الحالية: " + o.status;

    const select = document.createElement("select");

    ["جديد", "قيد التجهيز", "تم الشحن", "مكتمل", "ملغي"]
      .forEach(s => {
        const option = document.createElement("option");
        option.value = s;
        option.textContent = s;
        if (s === o.status) option.selected = true;
        select.append(option);
      });

    select.onchange = () => updateOrder(o.id, select.value);

    div.append(title, details, address, total, status, select);
    box.append(div);
  });
}

async function updateOrder(id, status) {
  if (!adminReady) return;

  const {error} = await client
    .from("orders")
    .update({status})
    .eq("id", id);

  if (error) {
    alert("تعذر تحديث الطلب: " + error.message);
    return;
  }

  alert("تم تحديث حالة الطلب.");
  loadOrders();
}

window.login = login;
window.addProduct = addProduct;
window.loadOrders = loadOrders;

})();
</script>
</body>
</html>
